services:
  # Set the AIO limit on each ScyllaDB node high enough to function
  aio-fix:
    image: busybox
    container_name: aio-fix
    privileged: true
    command: sysctl -w fs.aio-max-nr=1048576
    restart: "no"

  scylla-node1:
    image: scylladb/scylla:latest
    container_name: scylla-node1
    restart: always
    command: --smp 1 --memory 1G --overprovisioned 1 --api-address 0.0.0.0 --developer-mode 1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      aio-fix:
        condition: service_completed_successfully
    ports:
      - "9042:9042" 
    volumes:
      - scylla-test-data1:/var/lib/scylla
    networks:
      - test-network

  scylla-node2:
    image: scylladb/scylla:latest
    container_name: scylla-node2
    restart: always
    command: --seeds=scylla-node1 --smp 1 --memory 1G --overprovisioned 1 --api-address 0.0.0.0 --developer-mode 1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      aio-fix:
        condition: service_completed_successfully
      scylla-node1:
        condition: service_healthy
    volumes:
      - scylla-test-data2:/var/lib/scylla
    networks:
      - test-network

  scylla-node3:
    image: scylladb/scylla:latest
    container_name: scylla-node3
    restart: always
    command: --seeds=scylla-node1 --smp 1 --memory 1G --overprovisioned 1 --api-address 0.0.0.0 --developer-mode 1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      aio-fix:
        condition: service_completed_successfully
      scylla-node2:
        condition: service_healthy
    volumes:
      - scylla-test-data3:/var/lib/scylla
    networks:
      - test-network

  test-runner:
    image: golang:1.25-alpine 
    working_dir: /src
    volumes:
      - .:/src
      - go-cache:/go/pkg/mod
    networks:
      - test-network
    depends_on:
      scylla-node3:
        condition: service_healthy
    command: >
      sh -c '
        set -e
        
        echo "=== Dependencies ==="
        apk update
        apk add build-base
        go mod download
        
        UNIT_FAILED=""
        INT_FAILED=""
        
        echo ""
        echo "=== Running Unit Tests ==="
        (CGO_ENABLED=1 go test -v -race -tags=unit -p 1 ./...; echo $$? > /tmp/unit.exit) | tee /tmp/unit-test.log || true
        UNIT_EXIT=$$(cat /tmp/unit.exit)
        UNIT_PASS=$$(grep -c "^--- PASS:" /tmp/unit-test.log || true)
        UNIT_FAIL=$$(grep -c "^--- FAIL:" /tmp/unit-test.log || true)
        if [ "$$UNIT_EXIT" != "0" ]; then UNIT_FAILED=1; fi
        
        echo ""
        echo "=== Running Integration Tests ==="
        (CGO_ENABLED=1 go test -v -race -tags=integration -timeout 30m -p 1 ./...; echo $$? > /tmp/int.exit) | tee /tmp/int-test.log || true
        INT_EXIT=$$(cat /tmp/int.exit)
        INT_PASS=$$(grep -c "^--- PASS:" /tmp/int-test.log || true)
        INT_FAIL=$$(grep -c "^--- FAIL:" /tmp/int-test.log || true)
        if [ "$$INT_EXIT" != "0" ]; then INT_FAILED=1; fi
        
        echo ""
        echo "========================================"
        echo "           TEST RESULTS                 "
        echo "========================================"
        echo "Unit Tests:       $$UNIT_PASS passed, $$UNIT_FAIL failed"
        echo "Integration:      $$INT_PASS passed, $$INT_FAIL failed"
        echo "----------------------------------------"
        TOTAL_PASS=$$((UNIT_PASS + INT_PASS))
        TOTAL_FAIL=$$((UNIT_FAIL + INT_FAIL))
        echo "TOTAL:            $$TOTAL_PASS passed, $$TOTAL_FAIL failed"
        echo "========================================"
        
        if [ -n "$$UNIT_FAILED" ] || [ -n "$$INT_FAILED" ]; then
          echo "SOME TESTS FAILED"
          exit 1
        else
          echo "ALL TESTS PASSED"
          exit 0
        fi
      '

networks:
  test-network:
    driver: bridge

volumes:
  scylla-test-data1:
  scylla-test-data2:
  scylla-test-data3:
  go-cache: