name: Build Updated Chapters

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      changed: ${{ steps.set-matrix.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Detect updated chapters
        id: set-matrix
        run: |
          # Get list of changed chapter directories
          CHANGED_DIRS=$(git diff --name-only HEAD^ HEAD | grep -E '^ch-[0-9]+/' | cut -d'/' -f1 | sort -u)
          
          if [ -z "$CHANGED_DIRS" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "No chapter directories changed"
          else
            # Convert to JSON array for matrix strategy
            JSON_ARRAY=$(echo "$CHANGED_DIRS" | jq -R . | jq -s . | tr -d '\n')
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "Changed directories: $JSON_ARRAY"
          fi

  lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          
      - name: Run go vet
        working-directory: ${{ matrix.part }}
        run: |
          go mod download || true
          go vet -tags=unit,integration ./...
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ${{ matrix.part }}
          args: --timeout=5m --build-tags=unit,integration

  test:
    needs: [detect-changes, lint]
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Increase max async i/o requests for ScyllaDB
        run: sudo sysctl -w fs.aio-max-nr=1048576

      - name: Run tests for ${{ matrix.part }}
        if: hashFiles(format('{0}/docker-compose-test.yml', matrix.part)) != ''
        run: |
          if [ -f "${{ matrix.part }}/docker-compose-test.yml" ]; then
            docker compose -f ${{ matrix.part }}/docker-compose-test.yml up \
              --attach test-runner \
              --exit-code-from test-runner \
              --abort-on-container-exit
          elif [ -f "${{ matrix.part }}/deployment/docker-compose-test.yml" ]; then
            docker compose -f ${{ matrix.part }}/deployment/docker-compose-test.yml up \
              --attach test-runner \
              --exit-code-from test-runner \
              --abort-on-container-exit
          else
            echo "No docker-compose-test.yml found in ${{ matrix.part }}, skipping tests"
          fi
      
      - name: Cleanup
        if: always() && hashFiles(format('{0}/docker-compose-test.yml', matrix.part)) != ''
        run: |
          if [ -f "${{ matrix.part }}/docker-compose-test.yml" ]; then
            docker compose -f ${{ matrix.part }}/docker-compose-test.yml down -v --remove-orphans || true
          elif [ -f "${{ matrix.part }}/deployment/docker-compose-test.yml" ]; then
            docker compose -f ${{ matrix.part }}/deployment/docker-compose-test.yml down -v --remove-orphans || true
          fi

  build-and-push:
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        part: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.part }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=true

      - name: Detect Dockerfile structure
        id: detect
        run: |
          if [ -f "./${{ matrix.part }}/Dockerfile" ]; then
            echo "build_type=single" >> $GITHUB_OUTPUT
          elif [ -d "./${{ matrix.part }}/build" ]; then
            echo "build_type=multi" >> $GITHUB_OUTPUT
          else
            echo "build_type=none" >> $GITHUB_OUTPUT
          fi

      - name: Build and push single
        if: steps.detect.outputs.build_type == 'single'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.part }}
          file: ./${{ matrix.part }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}
      
      - name: Build and push multi
        if: steps.detect.outputs.build_type == 'multi'
        env:
          RAW_TAGS: ${{ steps.meta.outputs.tags }}
          RAW_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          base_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.part }}"
          shopt -s nullglob
          dockerfiles=(./${{ matrix.part }}/build/*.Dockerfile)
          if [ ${#dockerfiles[@]} -eq 0 ]; then
            echo "No Dockerfiles found in ./${{ matrix.part }}/build/"
            exit 1
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            service=$(basename "$dockerfile" .Dockerfile)
            tag_args=()
            while IFS= read -r tag || [ -n "$tag" ]; do
              [ -z "$tag" ] && continue
              service_tag="${tag//$base_image/$base_image-$service}"
              tag_args+=("--tag" "$service_tag")
            done <<< "$RAW_TAGS"
            label_args=()
            while IFS= read -r label || [ -n "$label" ]; do
              [ -z "$label" ] && continue
              label_args+=("--label" "$label")  # Removed escaping
            done <<< "$RAW_LABELS"
            docker buildx build \
              --file "$dockerfile" \
              "${tag_args[@]}" \
              "${label_args[@]}" \
              --push \
              --cache-from "type=gha,scope=${{ matrix.part }}-${service}" \
              --cache-to "type=gha,mode=max,scope=${{ matrix.part }}-${service}" \
              "./${{ matrix.part }}"
          done