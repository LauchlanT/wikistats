services:
  scylla-node1:
    image: scylladb/scylla:latest
    container_name: scylla-node1
    hostname: scylla
    profiles: ["scylla"]
    restart: always
    command: >
      --developer-mode 1
      --smp 1
      --memory 1G
      --overprovisioned 1
      --api-address 0.0.0.0
      --reactor-backend=epoll
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - scylla-data1:/var/lib/scylla
    networks:
      - wiki-network

  scylla-node2:
    image: scylladb/scylla:latest
    container_name: scylla-node2
    hostname: scylla
    profiles: ["scylla"]
    restart: always
    command: >
      --seeds=scylla-node1
      --developer-mode 1
      --smp 1
      --memory 1G
      --overprovisioned 1
      --api-address 0.0.0.0
      --reactor-backend=epoll
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      scylla-node1:
        condition: service_healthy
    volumes:
      - scylla-data2:/var/lib/scylla
    networks:
      - wiki-network

  scylla-node3:
    image: scylladb/scylla:latest
    container_name: scylla-node3
    hostname: scylla
    profiles: ["scylla"]
    restart: always
    command: >
      --seeds=scylla-node1
      --developer-mode 1
      --smp 1
      --memory 1G
      --overprovisioned 1
      --api-address 0.0.0.0
      --reactor-backend=epoll
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      scylla-node2:
        condition: service_healthy
    volumes:
      - scylla-data3:/var/lib/scylla
    networks:
      - wiki-network
  
  redpanda:
    image: redpandadata/redpanda:v23.3.13
    container_name: redpanda
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD-SHELL", "rpk topic list --brokers localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  wikistats-database:
    build:
      context: ..
      dockerfile: build/database.Dockerfile
    container_name: wikistats-database
    hostname: database
    restart: on-failure
    networks:
      - wiki-network
  
  wikistats-api:
    build:
      context: ..
      dockerfile: build/api.Dockerfile
    container_name: wikistats-api
    hostname: api
    restart: on-failure
    networks:
      - wiki-network
    ports:
      - "7000:7000"
    depends_on:
      wikistats-database:
        condition: service_started

  wikistats-producer:
    build:
      context: ..
      dockerfile: build/producer.Dockerfile
    container_name: wikistats-producer
    hostname: producer
    restart: on-failure
    networks:
      - wiki-network
    depends_on:
      redpanda:
        condition: service_healthy
  
  wikistats-consumer:
    build:
      context: ..
      dockerfile: build/consumer.Dockerfile
    container_name: wikistats-consumer
    hostname: consumer
    restart: on-failure
    networks:
      - wiki-network
    depends_on:
      wikistats-database:
        condition: service_started
      redpanda:
        condition: service_healthy
    

networks:
  wiki-network:
    driver: bridge

volumes:
  scylla-data1:
  scylla-data2:
  scylla-data3:
  redpanda-data1: