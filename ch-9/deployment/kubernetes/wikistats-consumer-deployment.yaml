apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikistats-consumer
  labels:
    app: wikistats-consumer
spec:
  replicas: 6
  selector:
    matchLabels:
      app: wikistats-consumer
  template:
    metadata:
      labels:
        app: wikistats-consumer
    spec:
      restartPolicy: Always 
      containers:
        - name: wikistats-consumer
          image: ghcr.io/lauchlant/wikistats-ch-9-consumer:latest
          securityContext:
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsUser: 1000
          ports:
            - containerPort: 2112
              protocol: TCP
          env:
            - name: REDPANDA_HOST
              value: "redpanda-0.redpanda:9092,redpanda-1.redpanda:9092,redpanda-2.redpanda:9092" 
            - name: DATABASE_HOST
              value: "wikistats-database"       
          livenessProbe:
            httpGet:
              path: /healthz
              port: 2112
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 2112
            initialDelaySeconds: 30
          