apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: ../../../kompose convert -f docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: redpanda-node3
  name: redpanda-node3
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redpanda-node3
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: ../../../kompose convert -f docker-compose.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: redpanda-node3
    spec:
      containers:
        - args:
            - redpanda
            - start
            - --node-id=3
            - --smp=1
            - --memory=1G
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda-node3:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda-node3:33145
            - --seeds=redpanda-node1:33145
          image: redpandadata/redpanda:v23.3.13
          livenessProbe:
            exec:
              command:
                - rpk topic list --brokers redpanda-node3:9092 >/dev/null 2>&1 || exit 1
            failureThreshold: 5
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          name: redpanda-node3
          securityContext:
            runAsGroup: 101
            runAsUser: 101
          volumeMounts:
            - mountPath: /var/lib/redpanda/data
              name: redpanda-data3
      hostname: redpanda-node3
      restartPolicy: Always
      volumes:
        - name: redpanda-data3
          persistentVolumeClaim:
            claimName: redpanda-data3
