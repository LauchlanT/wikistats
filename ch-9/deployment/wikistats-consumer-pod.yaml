apiVersion: v1
kind: Pod
metadata:
  annotations:
    kompose.cmd: ../../../kompose convert -f docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: wikistats-consumer
  name: wikistats-consumer
spec:
  containers:
    - image: ghcr.io/lauchlant/wikistats-ch-9-consumer:latest
      name: wikistats-consumer
      securityContext:
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsUser: 1000
  restartPolicy: OnFailure
