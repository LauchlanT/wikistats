services:
  scylla-node1:
    image: scylladb/scylla:2025.3
    container_name: scylla-node1
    restart: always
    command: >
      --developer-mode 1
      --smp 1
      --memory 1G
      --overprovisioned 1
      --api-address 0.0.0.0
      --reactor-backend=epoll
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    ports:
      - "9042:9042" 
    volumes:
      - scylla-test-data1:/var/lib/scylla
    networks:
      - test-network

  scylla-node2:
    image: scylladb/scylla:2025.3
    container_name: scylla-node2
    restart: always
    command: >
      --seeds=scylla-node1
      --developer-mode 1
      --smp 1
      --memory 1G
      --overprovisioned 1
      --api-address 0.0.0.0
      --reactor-backend=epoll
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      scylla-node1:
        condition: service_healthy
    volumes:
      - scylla-test-data2:/var/lib/scylla
    networks:
      - test-network

  scylla-node3:
    image: scylladb/scylla:2025.3
    container_name: scylla-node3
    restart: always
    command: >
      --seeds=scylla-node1
      --developer-mode 1
      --smp 1
      --memory 1G
      --overprovisioned 1
      --api-address 0.0.0.0
      --reactor-backend=epoll
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT cluster_name FROM system.local'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      scylla-node2:
        condition: service_healthy
    volumes:
      - scylla-test-data3:/var/lib/scylla
    networks:
      - test-network
    
  redpanda-node1:
    image: redpandadata/redpanda:v26.1.4
    container_name: redpanda-node1
    hostname: redpanda-node1
    security_opt:
      - no-new-privileges:true
    user: "101:101"
    command:
    - redpanda
    - start
    - --node-id=1
    - --smp=1
    - --memory=1G
    - --set
    - redpanda.auto_create_topics_enabled=true
    - --kafka-addr=internal://0.0.0.0:9092
    - --advertise-kafka-addr=internal://redpanda-node1:9092
    - --rpc-addr=0.0.0.0:33145
    - --advertise-rpc-addr=redpanda-node1:33145
    - --seeds=redpanda-node1:33145
    healthcheck:
      test: ["CMD-SHELL", "rpk topic list --brokers redpanda-node1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data1:/var/lib/redpanda/data:rw
    networks:
      - test-network
  
  wikistats-database:
    build:
      context: ..
      dockerfile: build/database.Dockerfile
    container_name: wikistats-database
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    hostname: database
    read_only: true
    restart: on-failure
    networks:
      - test-network
    env_file:
      - ../.test_env
  
  wikistats-api:
    build:
      context: ..
      dockerfile: build/api.Dockerfile
    container_name: wikistats-api
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    hostname: api
    read_only: true
    restart: on-failure
    networks:
      - test-network
    depends_on:
      wikistats-database:
        condition: service_started
    env_file:
      - ../.test_env

  wikistats-producer:
    build:
      context: ..
      dockerfile: build/producer.Dockerfile
    container_name: wikistats-producer
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    hostname: producer
    read_only: true
    restart: on-failure
    networks:
      - test-network
    depends_on:
      redpanda-node1:
        condition: service_healthy
    env_file:
      - ../.test_env
  
  wikistats-consumer:
    build:
      context: ..
      dockerfile: build/consumer.Dockerfile
    container_name: wikistats-consumer
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    hostname: consumer
    read_only: true
    restart: on-failure
    networks:
      - test-network
    depends_on:
      wikistats-database:
        condition: service_started
      redpanda-node1:
        condition: service_healthy
    env_file:
      - ../.test_env
  
  e2e-tester:
    build:
      context: ..
      dockerfile: e2e-testing/Dockerfile
    container_name: e2e-tester
    hostname: e2e-tester
    networks:
      - test-network
    env_file:
      - ../.test_env

  test-runner:
    image: golang:1.25-alpine 
    working_dir: /src
    volumes:
      - ..:/src
      - go-cache:/go/pkg/mod
    networks:
      - test-network
    depends_on:
      scylla-node3:
        condition: service_healthy
      redpanda-node1:
        condition: service_healthy
      e2e-tester:
        condition: service_started
    command: |
      sh -c '
        set -e
        
        echo "=== Dependencies ==="
        apk update
        apk add build-base curl
        go mod download
        
        UNIT_FAILED=""
        INT_FAILED=""
        
        echo ""
        echo "=== Running Unit Tests ==="
        (CGO_ENABLED=1 go test -v -race -tags=unit -p 1 ./...; echo $$? > /tmp/unit.exit) | tee /tmp/unit-test.log || true
        UNIT_EXIT=$$(cat /tmp/unit.exit)
        UNIT_PASS=$$(grep -c "^--- PASS:" /tmp/unit-test.log || true)
        UNIT_FAIL=$$(grep -c "^--- FAIL:" /tmp/unit-test.log || true)
        if [ "$$UNIT_EXIT" != "0" ]; then UNIT_FAILED=1; fi
        
        echo ""
        echo "=== Running Integration Tests ==="
        (CGO_ENABLED=1 go test -v -race -tags=integration -timeout 30m -p 1 ./...; echo $$? > /tmp/int.exit) | tee /tmp/int-test.log || true
        INT_EXIT=$$(cat /tmp/int.exit)
        INT_PASS=$$(grep -c "^--- PASS:" /tmp/int-test.log || true)
        INT_FAIL=$$(grep -c "^--- FAIL:" /tmp/int-test.log || true)
        if [ "$$INT_EXIT" != "0" ]; then INT_FAILED=1; fi
        
        echo ""
        echo "========================================"
        echo "           TEST RESULTS                 "
        echo "========================================"
        echo "Unit Tests:       $$UNIT_PASS passed, $$UNIT_FAIL failed"
        echo "Integration:      $$INT_PASS passed, $$INT_FAIL failed"
        echo "----------------------------------------"
        TOTAL_PASS=$$((UNIT_PASS + INT_PASS))
        TOTAL_FAIL=$$((UNIT_FAIL + INT_FAIL))
        echo "TOTAL:            $$TOTAL_PASS passed, $$TOTAL_FAIL failed"
        echo "========================================"
        
        if [ -n "$$UNIT_FAILED" ] || [ -n "$$INT_FAILED" ]; then
          echo "SOME TESTS FAILED - SKIPPING E2E TESTS"
          exit 1
        fi

        echo "=== Running E2E Test ==="
        E2E_RESPONSE=$$(curl -s "http://e2e-tester:7555/run-test?file=test.txt")
        echo "E2E Result: $$E2E_RESPONSE"
        if echo "$$E2E_RESPONSE" | grep -q "success"; then
          echo "ALL TESTS PASSED"
          exit 0
        else
          echo "E2E TEST FAILED"
          exit 1
        fi
      '

networks:
  test-network:
    driver: bridge

volumes:
  scylla-test-data1:
  scylla-test-data2:
  scylla-test-data3:
  redpanda-data1:
  go-cache: